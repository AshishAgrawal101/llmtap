  #       with: { python-version: "3.12" }
  #     - run: pip install git+https://github.com/AshishAgrawal101/llmtap -r requirements.txt pytest
  #     - run: llmtap wrap --cassette tests/cassettes/llm.jsonl --mode record --budget-session 2 -- pytest -q
