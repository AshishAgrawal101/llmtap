[build-system]
requires = ["setuptools>=77"]   # 77+: SPDX `license` string and `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "llmtap-proxy"
version = "0.2.2"
description = "The flight recorder & firewall for LLM apps. See, cache, replay, budget and secure every LLM call — zero code changes, zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "openai", "anthropic", "claude", "proxy", "observability", "cache", "testing", "vcr", "agents", "cost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "botocore>=1.34"]   # botocore: Bedrock SigV4 / EventStream tests only

[project.urls]
Homepage = "https://github.com/AshishAgrawal101/llmtap"
Issues = "https://github.com/AshishAgrawal101/llmtap/issues"

[project.scripts]
llmtap = "llmtap.cli:main"

[project.entry-points.pytest11]
llmtap = "llmtap.pytest_plugin"

[tool.setuptools]
packages = ["llmtap", "llmtap.ui"]

[tool.setuptools.package-data]
llmtap = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
