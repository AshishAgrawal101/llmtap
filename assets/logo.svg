<svg xmlns="http://www.w3.org/2000/svg" width="352" height="112" viewBox="0 0 352 112" role="img" aria-labelledby="title desc">
  <title id="title">llmtap</title>
  <desc id="desc">llmtap logo: a tap with a signal waveform flowing through it, followed by the llmtap wordmark.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B33"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
  </defs>

  <!-- icon tile: dark rounded square so the mark reads on light and dark themes -->
  <rect x="4" y="4" width="104" height="104" rx="26" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="102.5" height="102.5" rx="25.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- valve handle -->
  <rect x="50" y="20" width="30" height="7" rx="3.5" fill="url(#flow)"/>
  <rect x="61.5" y="26" width="7" height="9" rx="1.5" fill="url(#flow)"/>

  <!-- pipe + spout -->
  <path d="M18 35 H70 a18 18 0 0 1 18 18 V64 H74 V53 a4 4 0 0 0 -4 -4 H18 Z" fill="url(#flow)"/>

  <!-- signal waveform travelling through the pipe -->
  <path d="M22 42 H34 L38 37.5 L43 46.5 L47 39.5 L50 42 H66" fill="none" stroke="#0B1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- drop -->
  <path d="M81 72 C81 72 89 81.5 89 86.5 A8 8 0 0 1 73 86.5 C73 81.5 81 72 81 72 Z" fill="#22D3EE"/>
  <circle cx="78" cy="86" r="2" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- wordmark: gradient fill keeps contrast on both #ffffff and #0d1117 backgrounds -->
  <text x="128" y="76" fill="url(#word)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">llmtap</text>
</svg>
